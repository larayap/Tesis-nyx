name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desplegar-Tesis-nyx
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci || npm install
        working-directory: Cliente

      - name: Compilar
        # CI=false: react-scripts trata los warnings de ESLint como errores cuando
        # detecta un entorno de CI. El codigo tiene variables sin usar que no
        # corresponde arreglar aqui, y no impiden que la app funcione.
        run: CI=false npm run build
        working-directory: Cliente

      # Salvaguarda: el rsync usa --delete, asi que un build vacio borraria el sitio.
      - name: Verificar que el build produjo algo
        run: |
          test -f "Cliente/build/index.html" || { echo "El build no genero index.html en Cliente/build"; exit 1; }
          echo "Archivos a publicar: $(find "Cliente/build" -type f | wc -l)"

      - name: Preparar acceso SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Publicar en el servidor
        run: |
          rsync -az --delete             -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"             "Cliente/build/" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/nyx/"

      - name: Limpiar credenciales
        if: always()
        run: rm -f ~/.ssh/deploy_key
